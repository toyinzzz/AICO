version: '3.8'

services:
  aico-frontend-dev:
    build:
      context: ../../frontend
      dockerfile: ../environments/dev/Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:5000/api
      - VITE_AI_SERVICE_URL=http://localhost:8000
      - VITE_ENVIRONMENT=development
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - aico-dev-network

  aico-api:
    build:
      context: ../../backend
      dockerfile: ../environments/dev/Dockerfile.backend.dev
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=aico-db;Database=aico_dev;Username=aico_user;Password=aico_password
      - ASPNETCORE_URLS=http://+:5000
    depends_on:
      - aico-db
    networks:
      - aico-dev-network
    restart: unless-stopped

  aico-db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aico_user
      - POSTGRES_PASSWORD=aico_password
      - POSTGRES_DB=aico_dev
    networks:
      - aico-dev-network  
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
  

networks:
  aico-dev-network:
    driver: bridge

volumes:
  postgres_dev_data: