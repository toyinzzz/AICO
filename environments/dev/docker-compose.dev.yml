version: '3.8'

services:
  aico-frontend-dev:
    build:
      context: ../../frontend
      dockerfile: ../environments/dev/Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:5000/api
      - VITE_AI_SERVICE_URL=http://localhost:8000
      - VITE_ENVIRONMENT=development
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - aico-dev-network

